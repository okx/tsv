[profile.default]
src = "."
test = "test"
script = "script"
out = "../../../out/securitize-disperse"
cache_path = "../../../cache/securitize-disperse"
libs = ["../../../dependencies", "../../v4-core/lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=../../../dependencies/@openzeppelin-contracts-5.5.0/",
  "forge-std/=../../v4-core/lib/forge-std/src/"
]
