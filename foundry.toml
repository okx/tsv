[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib", "dependencies"]
solc_version = "0.8.26"
evm_version = "cancun"
auto_detect_solc = false
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"

remappings = [
  "v4-core/=lib/v4-core/src/",
  "tsv-v1/=src/v1/",
  "forge-std/=lib/v4-core/lib/forge-std/src/",
  "@openzeppelin/contracts/=dependencies/@openzeppelin-contracts-5.5.0/",
  "@openzeppelin/contracts-upgradeable/=dependencies/@openzeppelin-contracts-upgradeable-5.5.0/"
]

[profile.unit]
test = "test/unit"
solc_version = "0.8.26"

[profile.local]
test = "test/integration/local"
solc_version = "0.8.26"

[soldeer]
remappings_generate = false

[dependencies]
"@openzeppelin-contracts" = "5.5.0"
"@openzeppelin-contracts-upgradeable" = "5.5.0"
