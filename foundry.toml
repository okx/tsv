[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib", "dependencies"]
solc_version = "0.8.26"
evm_version = "cancun"
auto_detect_solc = false
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"

remappings = [
  "dex-adapters/=lib/dex-adapters/src/",
  "lib/dex-adapters/:@interfaces/=lib/dex-adapters/src/interfaces/",
  "lib/dex-adapters/:@libraries/=lib/dex-adapters/src/libraries/",
  "v4-periphery/=lib/v4-periphery/src/",
  "src/v1/permissionedPools/:@openzeppelin/contracts/=lib/v4-periphery/lib/v4-core/lib/openzeppelin-contracts/contracts/",
  "src/v1/permissionedPools/:@uniswap/v4-core/src/=lib/v4-periphery/lib/v4-core/src/",
  "src/v1/permissionedPools/:solmate/=lib/v4-periphery/lib/v4-core/lib/solmate/",
  "lib/v4-periphery/:@openzeppelin/contracts/=lib/v4-periphery/lib/v4-core/lib/openzeppelin-contracts/contracts/",
  "lib/v4-periphery/:@uniswap/v4-core/src/=lib/v4-periphery/lib/v4-core/src/",
  "lib/v4-periphery/:solmate/=lib/v4-periphery/lib/v4-core/lib/solmate/",
  "v4-core/=lib/v4-core/src/",
  "tsv-v1/=src/v1/",
  "forge-std/=lib/v4-core/lib/forge-std/src/",
  "@openzeppelin/contracts/=dependencies/@openzeppelin-contracts-5.5.0/",
  "@openzeppelin/contracts-upgradeable/=dependencies/@openzeppelin-contracts-upgradeable-5.5.0/"
]

[soldeer]
remappings_generate = false

[dependencies]
"@openzeppelin-contracts" = "5.5.0"
"@openzeppelin-contracts-upgradeable" = "5.5.0"
